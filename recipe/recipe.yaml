schema_version: 1

context:
  name: BoltzTraP2
  version: "26.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: 5c41b9b03aced3199bd0d51a8fbcbd73e23661c849cdf022a377df317d16db1d
  patches:
    - spglib.patch

build:
  number: 1
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - btp2 = BoltzTraP2.interface:btp2_main

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cython
  host:
    - pip
    - python
    - cython
    - spglib
    - eigen
    - numpy
    - packaging
    - setuptools
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - scipy
    - matplotlib-base
    - ase
    - netcdf4
    - cython

tests:
  - python:
      imports:
        - BoltzTraP2
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - btp2 dope -h

about:
  license: GPL-3.0-only
  license_file: LICENSE.txt
  summary: Boltzmann Transport Properties (BoltzTraP) is a program for calculating the semi-classic transport coefficients
  description: |
    BoltzTraP2 is a modern implementation of the smoothed Fourier
    interpolation algorithm for electronic bands that formed the base of
    the original and widely used BoltzTraP code. One of the most typical
    uses of BoltzTraP is the calculation of thermoelectric transport
    coefficients as functions of temperature and chemical potential in
    the rigid-band picture. However, many other features are available,
    including 3D plots of Fermi surfaces based on the reconstructed bands.
  homepage: https://www.imc.tuwien.ac.at/forschungsbereich_theoretische_chemie/forschungsgruppen/prof_dr_gkh_madsen_theoretical_materials_chemistry/boltztrap/
  repository: https://gitlab.com/sousaw/BoltzTraP2/
  documentation: https://gitlab.com/sousaw/BoltzTraP2/

extra:
  recipe-maintainers:
    - jan-janssen
